{% extends "base.html" %}
{% block title %}Operator Login{% endblock %}
{% block content %}
<div class="login-box card">
  <h1>🏭 Smart Factory</h1>
  <p style="text-align:center;opacity:.7">Operator login</p>
  <form method="post">
    <label>Operator ID</label>
    <select name="operator_id">
      {% for o in operators %}<option value="{{ o.operator_id }}">{{ o.operator_id }} — {{ o.name }}</option>{% endfor %}
    </select>
    <label>Password</label>
    <input type="password" name="password" placeholder="factory123" required>
    <div style="margin-top:16px"><button class="btn" type="submit" style="width:100%">Login</button></div>
  </form>
  <p class="hint">Demo password for all operators: <b>factory123</b></p>
</div>
{% endblock %}
