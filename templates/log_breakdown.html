{% extends "base.html" %}
{% block title %}Log breakdown{% endblock %}
{% block content %}
<div class="card" style="max-width:640px">
  <h2>🔧 Log a breakdown</h2>
  <form method="post">
    <label>Machine</label>
    <select name="machine_id">{% for m in machines %}<option>{{ m.machine_id }}</option>{% endfor %}</select>
    <label>Downtime hours</label><input type="number" name="downtime_hours" step="0.1" min="0.1" value="2" required>
    <label>Cause</label>
    <select name="cause">{% for c in causes %}<option>{{ c }}</option>{% endfor %}</select>
    <label>Repair cost (₹, optional)</label><input type="number" name="repair_cost_rs" min="0" value="5000">
    <div style="margin-top:16px"><button class="btn warn" type="submit">Save breakdown</button></div>
  </form>
</div>
{% endblock %}
